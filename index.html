<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Critter Quest</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Critter Quest">
<meta name="theme-color" content="#2a2440">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --body: #4a3f8c;      /* a purple handheld, like the indigo GBA */
    --body-lt: #5c50a4;
    --body-dk: #352c6a;
    --bezel: #22202e;
    --btn: #2a2638;
    --btn-a: #c8384c;
    --btn-b: #c8384c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--body-dk);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #console {
    position: fixed; inset: 0;
    padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 80% at 50% 0%, var(--body-lt), var(--body) 60%, var(--body-dk));
    display: grid;
    grid-template-rows: minmax(0, auto) 1fr;
    grid-template-areas: "screen" "controls";
    gap: 12px;
    max-width: 520px; margin: 0 auto;
  }
  #bezel {
    grid-area: screen;
    background: var(--bezel);
    border-radius: 14px 14px 36px 14px;
    padding: 8px 8px 18px;
    box-shadow: inset 0 2px 0 #3a3650, 0 3px 0 var(--body-dk);
    display: flex; flex-direction: column; align-items: center;
  }
  #screen-wrap { width: 100%; aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; }
  #display { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #brand { margin-top: 8px; color: #8d88b0; font-size: 11px; letter-spacing: 3px; font-weight: 700; }

  #controls {
    grid-area: controls;
    position: relative;
    min-height: 210px;
  }
  #dpad {
    position: absolute; left: 4%; top: calc(50% - 100px);
    width: 150px; height: 150px;
    touch-action: none;
  }
  #dpad .arm {
    position: absolute; background: var(--btn); border-radius: 6px;
    box-shadow: 0 4px 0 #17151f;
  }
  #dpad .h { left: 0; right: 0; top: 50px; height: 50px; }
  #dpad .v { top: 0; bottom: 0; left: 50px; width: 50px; }
  #dpad .dot { position: absolute; left: 63px; top: 63px; width: 24px; height: 24px; border-radius: 50%; background: #34304a; }
  #dpad .tick { position: absolute; width: 0; height: 0; border: 7px solid transparent; opacity: .55; }
  #dpad .tick.up { left: 68px; top: 10px; border-bottom-color: #8d88b0; }
  #dpad .tick.down { left: 68px; bottom: 10px; border-top-color: #8d88b0; }
  #dpad .tick.left { top: 68px; left: 10px; border-right-color: #8d88b0; }
  #dpad .tick.right { top: 68px; right: 10px; border-left-color: #8d88b0; }
  #dpad[data-dir="up"] .tick.up, #dpad[data-dir="down"] .tick.down,
  #dpad[data-dir="left"] .tick.left, #dpad[data-dir="right"] .tick.right { opacity: 1; }

  .round {
    position: absolute; width: 72px; height: 72px; border-radius: 50%;
    background: var(--btn-a); color: #ffd8dc; font-weight: 800; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 5px 0 #7a1c2a, inset 0 3px 0 #e05468;
    touch-action: none;
  }
  .round.on, .pill.on { transform: translateY(4px); box-shadow: 0 1px 0 #7a1c2a; }
  #btn-a { right: 4%; top: calc(50% - 110px); }
  #btn-b { right: calc(4% + 84px); top: calc(50% - 66px); }
  .pill {
    position: absolute; top: calc(50% + 78px); left: 50%; transform: translateX(-50%);
    width: 84px; height: 26px; border-radius: 13px;
    background: var(--btn); color: #8d88b0; font-size: 11px; font-weight: 800; letter-spacing: 2px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 #17151f;
  }
  .pill.on { transform: translateX(-50%) translateY(3px); box-shadow: none; }

  #keys { display: none; color: #b8b2e0; font-size: 13px; text-align: center; line-height: 1.6; }
  #keys b { color: #fff; }

  /* phone turned sideways: controls go on either side of the screen */
  @media (orientation: landscape) and (max-height: 520px) {
    #console {
      max-width: none;
      grid-template-columns: 1fr auto 1fr; grid-template-rows: 1fr;
      grid-template-areas: "left screen right";
      padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
      align-items: center;
    }
    #bezel { height: 100%; aspect-ratio: auto; justify-content: center; padding: 8px; border-radius: 14px; }
    #screen-wrap { height: 100%; width: auto; aspect-ratio: 3 / 2; }
    #brand { display: none; }
    #controls { display: contents; }
    #dpad { position: relative; grid-area: left; left: 0; top: 0; justify-self: center; }
    #right-btns { grid-area: right; position: relative; width: 170px; height: 190px; justify-self: center; }
    #btn-a { right: 0; top: 20px; }
    #btn-b { right: 84px; top: 64px; }
    .pill { top: auto; bottom: 0; }
  }
  /* a computer with a keyboard: hide the touch buttons, show the keys */
  @media (hover: hover) and (pointer: fine) {
    #console { max-width: 820px; }
    #controls > *:not(#keys) { display: none; }
    #keys { display: block; padding-top: 8px; }
    #controls { min-height: 0; }
  }
</style>
</head>
<body>
<div id="console">
  <div id="bezel">
    <div id="screen-wrap"><canvas id="display" width="240" height="160"></canvas></div>
    <div id="brand">CRITTER QUEST</div>
  </div>
  <div id="controls">
    <div id="dpad">
      <div class="arm h"></div><div class="arm v"></div><div class="dot"></div>
      <div class="tick up"></div><div class="tick down"></div><div class="tick left"></div><div class="tick right"></div>
    </div>
    <div id="right-btns">
      <div class="round" id="btn-a" data-btn="a">A</div>
      <div class="round" id="btn-b" data-btn="b">B</div>
      <div class="pill" data-btn="start">START</div>
    </div>
    <div id="keys">
      <b>Arrow keys</b> walk &nbsp;·&nbsp; <b>Z</b> = A &nbsp;·&nbsp; <b>X</b> = B (hold to run) &nbsp;·&nbsp; <b>Enter</b> = START
    </div>
  </div>
</div>
<script src="js/pixel.js"></script>
<script src="js/font.js"></script>
<script src="js/art.js"></script>
<script src="js/data.js"></script>
<script src="js/maps.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/battle.js"></script>
<script src="js/menus.js"></script>
<script src="js/scripts.js"></script>
<script src="js/main.js"></script>
</body>
</html>
